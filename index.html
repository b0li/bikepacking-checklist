<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1d23">
<meta name="description" content="Bikepacking Checklist — abhaken, einpacken, losfahren">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bikepacking Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>

	:root {
		--bg: #1a1d23;
		--surface: #22262e;
		--surface-hover: #2a2f38;
		--border: #2e3340;
		--text: #e8e6e3;
		--text-muted: #8b8d94;
		--accent: #d4a55a;
		--accent-dim: rgba(212, 165, 90, 0.15);
		--green: #6abf69;
		--green-dim: rgba(106, 191, 105, 0.12);
		--red: #e06c6c;
		--font-display: 'DM Serif Display', Georgia, serif;
		--font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
		--radius: 10px;
	}

	* { box-sizing: border-box; margin: 0; padding: 0; }

	body {
		background: var(--bg);
		font-family: var(--font-body);
		color: var(--text);
		min-height: 100vh;
		min-height: 100dvh;
		-webkit-font-smoothing: antialiased;
		overscroll-behavior: none;
		overflow-x: hidden;
	}

	.header {
		padding: 28px 20px 20px;
		text-align: center;
		border-bottom: 1px solid var(--border);
		background: linear-gradient(180deg, rgba(212,165,90,0.06) 0%, transparent 100%);
		position: sticky;
		top: 0;
		z-index: 10;
		backdrop-filter: blur(12px);
		-webkit-backdrop-filter: blur(12px);
	}

	/* Safe area for notch devices */
	@supports (padding-top: env(safe-area-inset-top)) {
		.header { padding-top: calc(28px + env(safe-area-inset-top)); }
		.lang-switch { top: calc(14px + env(safe-area-inset-top)); }
	}

	.header h1 {
		font-family: var(--font-display);
		font-size: 28px;
		font-weight: 400;
		letter-spacing: 0.5px;
		color: var(--accent);
		margin-top: 18px;
		margin-bottom: 4px;
	}

	.header .subtitle {
		font-size: 13px;
		color: var(--text-muted);
		letter-spacing: 0.3px;
	}

	.lang-switch {
		position: absolute;
		top: 14px;
		right: 14px;
		display: flex;
		gap: 2px;
		background: var(--surface);
		border: 1px solid var(--border);
		border-radius: 8px;
		padding: 2px;
	}

	.lang-btn {
		background: none;
		border: none;
		color: var(--text-muted);
		font-family: var(--font-body);
		font-size: 11px;
		font-weight: 600;
		padding: 4px 8px;
		border-radius: 6px;
		cursor: pointer;
		letter-spacing: 0.5px;
		transition: all 0.15s;
		-webkit-tap-highlight-color: transparent;
	}

	.lang-btn.active {
		background: var(--accent);
		color: var(--bg);
	}

	.progress-wrap {
		padding: 16px 20px;
		display: flex;
		align-items: center;
		gap: 12px;
		position: sticky;
		top: 78px;
		z-index: 9;
		background: var(--bg);
	}

	.progress-bar {
		flex: 1;
		height: 6px;
		background: var(--border);
		border-radius: 3px;
		overflow: hidden;
	}

	.progress-fill {
		height: 100%;
		background: var(--accent);
		border-radius: 3px;
		transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
	}

	.progress-text {
		font-size: 13px;
		font-weight: 500;
		color: var(--text-muted);
		white-space: nowrap;
		min-width: 52px;
		text-align: right;
	}

	.all-done {
		text-align: center;
		padding: 24px 20px 8px;
		font-size: 15px;
		color: var(--green);
		font-weight: 500;
	}

	.category {
		margin: 0 12px 8px;
		background: var(--surface);
		border-radius: var(--radius);
		border: 1px solid var(--border);
		overflow: hidden;
	}

	.cat-header {
		display: flex;
		align-items: center;
		padding: 14px 16px;
		cursor: pointer;
		user-select: none;
		-webkit-user-select: none;
		-webkit-tap-highlight-color: transparent;
		gap: 10px;
		transition: background 0.15s;
	}

	.cat-header:active { background: var(--surface-hover); }

.cat-title {
		flex: 1;
		font-size: 15px;
		font-weight: 600;
		letter-spacing: 0.2px;
	}

	.cat-badge {
		font-size: 11px;
		font-weight: 500;
		padding: 2px 8px;
		border-radius: 10px;
		background: var(--accent-dim);
		color: var(--accent);
		transition: all 0.2s;
	}

	.cat-badge.done {
		background: var(--green-dim);
		color: var(--green);
	}

	.cat-chevron {
		color: var(--text-muted);
		font-size: 12px;
		transition: transform 0.2s;
	}

	.cat-chevron.open { transform: rotate(90deg); }

	.cat-body { display: none; }
	.cat-body.open { display: block; }

	.item-list { padding: 0 8px 4px; }

	.item {
		display: flex;
		align-items: center;
		padding: 10px 12px;
		gap: 12px;
		border-radius: 8px;
		cursor: pointer;
		user-select: none;
		-webkit-user-select: none;
		-webkit-tap-highlight-color: transparent;
		transition: background 0.12s;
	}

	.item:active { background: var(--surface-hover); }

	.checkbox {
		width: 22px;
		height: 22px;
		border-radius: 6px;
		border: 2px solid var(--border);
		display: flex;
		align-items: center;
		justify-content: center;
		flex-shrink: 0;
		transition: all 0.2s;
	}

	.checkbox.checked {
		background: var(--green);
		border-color: var(--green);
	}

	.checkbox svg { display: none; }
	.checkbox.checked svg { display: block; }

	.item-text {
		flex: 1;
		font-size: 14px;
		line-height: 1.4;
		transition: opacity 0.2s;
	}

	.item-text.done {
		opacity: 0.4;
		text-decoration: line-through;
		text-decoration-color: var(--text-muted);
	}

	.item-delete {
		opacity: 0;
		color: var(--red);
		font-size: 20px;
		padding: 0 4px;
		cursor: pointer;
		background: none;
		border: none;
		line-height: 1;
		transition: opacity 0.15s;
	}

	@media (hover: hover) {
		.cat-header:hover { background: var(--surface-hover); }
		.item:hover { background: var(--surface-hover); }
		.item:hover .item-delete { opacity: 0.6; }
		.item-delete:hover { opacity: 1 !important; }
	}

	@media (pointer: coarse) {
		.item-delete { opacity: 0.35; }
	}

	.add-row {
		display: flex;
		align-items: center;
		padding: 4px 12px 10px;
		gap: 8px;
	}

	.add-btn {
		font-size: 13px;
		color: var(--accent);
		background: none;
		border: none;
		cursor: pointer;
		padding: 6px 4px;
		font-family: var(--font-body);
		opacity: 0.7;
		transition: opacity 0.15s;
		-webkit-tap-highlight-color: transparent;
	}

	.add-btn:hover { opacity: 1; }

	.add-input {
		flex: 1;
		background: var(--bg);
		border: 1px solid var(--border);
		border-radius: 6px;
		padding: 8px 10px;
		font-size: 14px;
		color: var(--text);
		font-family: var(--font-body);
		outline: none;
	}

	.add-input:focus { border-color: var(--accent); }

	.add-confirm {
		background: var(--accent);
		color: var(--bg);
		border: none;
		border-radius: 6px;
		padding: 8px 14px;
		font-size: 15px;
		font-weight: 600;
		cursor: pointer;
		font-family: var(--font-body);
	}

	.footer {
		padding: 20px;
		display: flex;
		justify-content: center;
		gap: 12px;
		flex-wrap: wrap;
	}

	@supports (padding-bottom: env(safe-area-inset-bottom)) {
		.footer { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
	}

	.footer-btn {
		background: none;
		border: 1px solid var(--border);
		color: var(--text-muted);
		padding: 10px 20px;
		border-radius: 8px;
		font-size: 13px;
		cursor: pointer;
		font-family: var(--font-body);
		transition: all 0.15s;
		-webkit-tap-highlight-color: transparent;
	}

	.footer-btn:hover,
	.footer-btn:active {
		border-color: var(--accent);
		color: var(--accent);
	}

	.footer-btn.danger:hover,
	.footer-btn.danger:active {
		border-color: var(--red);
		color: var(--red);
	}

	.install-banner {
		display: none;
		margin: 12px;
		padding: 14px 16px;
		background: var(--accent-dim);
		border: 1px solid rgba(212, 165, 90, 0.3);
		border-radius: var(--radius);
		font-size: 13px;
		color: var(--accent);
		text-align: center;
		line-height: 1.5;
	}

	.trip-selector {
		display: flex;
		gap: 8px;
		padding: 12px 12px 4px;
	}

	.trip-btn {
		flex: 1;
		padding: 8px 4px;
		border-radius: 8px;
		border: 1px solid var(--border);
		background: var(--surface);
		color: var(--text-muted);
		font-family: var(--font-body);
		font-size: 12px;
		font-weight: 500;
		cursor: pointer;
		text-align: center;
		transition: all 0.15s;
		-webkit-tap-highlight-color: transparent;
		white-space: nowrap;
	}

	.trip-btn.active {
		background: var(--accent-dim);
		border-color: var(--accent);
		color: var(--accent);
		font-weight: 600;
	}

	@keyframes slideOutLeft {
		from { transform: translateX(0); opacity: 1; }
		to   { transform: translateX(-40px); opacity: 0; }
	}
	@keyframes slideOutRight {
		from { transform: translateX(0); opacity: 1; }
		to   { transform: translateX(40px); opacity: 0; }
	}
	@keyframes slideInFromRight {
		from { transform: translateX(40px); opacity: 0; }
		to   { transform: translateX(0); opacity: 1; }
	}
	@keyframes slideInFromLeft {
		from { transform: translateX(-40px); opacity: 0; }
		to   { transform: translateX(0); opacity: 1; }
	}
	.lang-slide-out-left  { animation: slideOutLeft     0.18s ease-in  forwards; pointer-events: none; }
	.lang-slide-out-right { animation: slideOutRight    0.18s ease-in  forwards; pointer-events: none; }
	.lang-slide-in-right  { animation: slideInFromRight 0.22s ease-out forwards; }
	.lang-slide-in-left   { animation: slideInFromLeft  0.22s ease-out forwards; }

</style>
</head>
<body>

<div class="header">
	<div class="lang-switch" id="langSwitch">
		<button class="lang-btn" data-lang="de">DE</button>
		<button class="lang-btn" data-lang="en">EN</button>

<div id="installBanner" class="install-banner"></div>

<div class="trip-selector" id="tripSelector"></div>
<div class="trip-selector" id="accoSelector"></div>

<div class="progress-wrap">
	<div class="progress-bar">
		<div class="progress-fill" id="progressFill"></div>

<div id="allDone" class="all-done" style="display:none"></div>

		tripLevel: 0,
		accoType: 'camp',
		lang: detectLang(),
	};

	function detectLang() {
		const lang = ( navigator.language || 'de' ).slice( 0, 2 ).toLowerCase();
		return lang === 'en' ? 'en' : 'de';
	}

	function getItemText( item ) {
		if ( state.lang === 'en' && ITEMS_EN[item.id] ) return ITEMS_EN[item.id];
		return item.text;
	}

	function getCatTitle( cat ) {
		return I18N[state.lang].categories[cat.id] || cat.title;
	}

	function mergeWithDefaults( savedCategories ) {

		// Build lookup of default items by id
		const defaultItemMap = {};

		DEFAULT_CATEGORIES.forEach( cat => {
			cat.items.forEach( item => {
				defaultItemMap[item.id] = item;
			});
		});

		// Track which ids exist in saved state
		const savedItemIds = {};

		savedCategories.forEach( cat => {
			cat.items.forEach( item => {

				savedItemIds[item.id] = true;

				// Copy minTrip from default if missing
				if ( item.minTrip === undefined && defaultItemMap[item.id] && defaultItemMap[item.id].minTrip !== undefined ) {
					item.minTrip = defaultItemMap[item.id].minTrip;
				}

				// Copy camping flag from default if missing
				if ( item.camping === undefined && defaultItemMap[item.id] && defaultItemMap[item.id].camping ) {
					item.camping = defaultItemMap[item.id].camping;
				}

			});
		});

		// Add new default items not yet in saved state
		DEFAULT_CATEGORIES.forEach( defaultCat => {

			const savedCat = savedCategories.find( c => c.id === defaultCat.id );

			if ( ! savedCat ) return;

			defaultCat.items.forEach( defaultItem => {

				if ( ! savedItemIds[defaultItem.id] ) {
					savedCat.items.push( JSON.parse( JSON.stringify( defaultItem ) ) );
				}

			});

		});

		return savedCategories;

	}

	function loadState() {

		try {

			const raw = localStorage.getItem( STORAGE_KEY );

			if ( raw ) {

				const data = JSON.parse( raw );
				if ( data.categories ) state.categories = mergeWithDefaults( data.categories );
				if ( data.checked ) state.checked = data.checked;
				if ( data.expanded ) state.expanded = data.expanded;
				if ( typeof data.tripLevel === 'number' ) state.tripLevel = data.tripLevel;
				if ( data.accoType ) state.accoType = data.accoType;
				if ( data.lang ) state.lang = data.lang;

			} else {

				state.categories.forEach( c => state.expanded[c.id] = true );

			}

		} catch ( e ) {

			state.categories.forEach( c => state.expanded[c.id] = true );

		}

	}

	function saveState() {

		try {

			localStorage.setItem( STORAGE_KEY, JSON.stringify( {
				categories: state.categories,
				checked: state.checked,
				expanded: state.expanded,
				tripLevel: state.tripLevel,
				accoType: state.accoType,
				lang: state.lang,
			}));

		} catch ( e ) {
			console.error( 'Save failed:', e );
		}

	}

	function applyLang() {

		const t = I18N[state.lang];

		document.documentElement.lang = state.lang;
		document.getElementById( 'appSubtitle' ).textContent = t.subtitle;
		document.getElementById( 'installBanner' ).textContent = t.installHint;
		document.getElementById( 'allDone' ).textContent = t.allDone;
		document.getElementById( 'resetBtn' ).textContent = t.resetChecks;
		document.getElementById( 'resetAllBtn' ).textContent = t.resetAll;

		document.querySelectorAll( '.lang-btn' ).forEach( btn => {
			btn.classList.toggle( 'active', btn.dataset.lang === state.lang );
		});

	}

	function visibleItems( cat ) {
		return cat.items.filter( item => {
			if ( ( item.minTrip || 0 ) > state.tripLevel ) return false;
			if ( item.camping && state.accoType === 'hotel' ) return false;
			return true;
		});
	}

	function updateProgress() {

		let total = 0;
		let done = 0;

		state.categories.forEach( cat => {

			visibleItems( cat ).forEach( item => {

				total++;
				if ( state.checked[item.id] ) done++;

			});

		});

		const pct = total > 0 ? ( done / total ) * 100 : 0;

		document.getElementById( 'progressFill' ).style.width = pct + '%';
		document.getElementById( 'progressText' ).textContent = done + ' / ' + total;
		document.getElementById( 'allDone' ).style.display = pct === 100 ? 'block' : 'none';

	}

	function renderTripSelector() {

		const t = I18N[state.lang];
		const container = document.getElementById( 'tripSelector' );
		container.innerHTML = '';

		TRIP_TYPES.forEach( trip => {

			const btn = document.createElement( 'button' );
			btn.className = 'trip-btn' + ( trip.level === state.tripLevel ? ' active' : '' );
			btn.textContent = t.tripTypes[trip.id];

			btn.addEventListener( 'click', () => {

				state.tripLevel = trip.level;
				saveState();
				renderTripSelector();
				render();

			});

			container.appendChild( btn );

		});

	}

	function renderAccoSelector() {

		const t = I18N[state.lang];
		const container = document.getElementById( 'accoSelector' );
		container.innerHTML = '';

		ACCO_TYPES.forEach( acco => {

			const btn = document.createElement( 'button' );
			btn.className = 'trip-btn' + ( acco.id === state.accoType ? ' active' : '' );
			btn.textContent = t.accoTypes[acco.id];

			btn.addEventListener( 'click', () => {

				state.accoType = acco.id;
				saveState();
				renderAccoSelector();
				render();

			});

			container.appendChild( btn );

		});

	}

	function render() {

		const t = I18N[state.lang];
		const container = document.getElementById( 'categoryList' );
		container.innerHTML = '';

		state.categories.forEach( cat => {

			const items = visibleItems( cat );
			const catChecked = items.filter( i => state.checked[i.id] ).length;
			const catDone = catChecked === items.length && items.length > 0;
			const isOpen = state.expanded[cat.id];

			const catEl = document.createElement( 'div' );
			catEl.className = 'category';

			const header = document.createElement( 'div' );
			header.className = 'cat-header';
			header.innerHTML = `
				<span class="cat-title">${getCatTitle( cat )}</span>
				<span class="cat-badge${catDone ? ' done' : ''}">${catChecked}/${items.length}</span>
				<span class="cat-chevron${isOpen ? ' open' : ''}">▶</span>
			`;

			header.addEventListener( 'click', () => {

				state.expanded[cat.id] = ! state.expanded[cat.id];
				saveState();
				render();

			});

			catEl.appendChild( header );

			const body = document.createElement( 'div' );
			body.className = 'cat-body' + ( isOpen ? ' open' : '' );

			const list = document.createElement( 'div' );
			list.className = 'item-list';

			items.forEach( item => {

				const row = document.createElement( 'div' );
				row.className = 'item';

				const isChecked = state.checked[item.id];

				row.innerHTML = `
					<div class="checkbox${isChecked ? ' checked' : ''}">
						<svg width="14" height="14" viewBox="0 0 14 14" fill="none">
							<path d="M3 7.5L5.5 10L11 4" stroke="#1a1d23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
						</svg>
					</div>
					<span class="item-text${isChecked ? ' done' : ''}">${getItemText( item )}</span>
					<button class="item-delete" aria-label="${t.deleteLabel}">×</button>
				`;

				row.addEventListener( 'click', ( e ) => {

					if ( e.target.closest( '.item-delete' ) ) return;
					state.checked[item.id] = ! state.checked[item.id];
					saveState();
					render();

				});

				row.querySelector( '.item-delete' ).addEventListener( 'click', ( e ) => {

					e.stopPropagation();
					cat.items = cat.items.filter( i => i.id !== item.id );
					delete state.checked[item.id];
					saveState();
					render();

				});

				list.appendChild( row );

			});

			body.appendChild( list );

			// Add item row
			const addRow = document.createElement( 'div' );
			addRow.className = 'add-row';

			const addBtn = document.createElement( 'button' );
			addBtn.className = 'add-btn';
			addBtn.textContent = t.addBtn;

			addBtn.addEventListener( 'click', () => {

				addRow.innerHTML = '';

				const input = document.createElement( 'input' );
				input.className = 'add-input';
				input.type = 'text';
				input.placeholder = t.addPlaceholder;

				const confirm = document.createElement( 'button' );
				confirm.className = 'add-confirm';
				confirm.textContent = '+';

				const doAdd = () => {

					const val = input.value.trim();

					if ( val ) {

						cat.items.push( { id: 'custom-' + Date.now(), text: val } );
						saveState();
						render();

					}

				};

				input.addEventListener( 'keydown', ( e ) => {

					if ( e.key === 'Enter' ) doAdd();

				});

				confirm.addEventListener( 'click', doAdd );

				addRow.appendChild( input );
				addRow.appendChild( confirm );

				setTimeout( () => input.focus(), 50 );

			});

			addRow.appendChild( addBtn );
			body.appendChild( addRow );

			catEl.appendChild( body );
			container.appendChild( catEl );

		});

		updateProgress();

	}

	// Language switch
	document.getElementById( 'langSwitch' ).addEventListener( 'click', ( e ) => {

		const btn = e.target.closest( '.lang-btn' );
		if ( ! btn || btn.dataset.lang === state.lang ) return;

		const newLang = btn.dataset.lang;
		const toRight = newLang === 'de'; // EN→DE slides right, DE→EN slides left
		const list = document.getElementById( 'categoryList' );

		list.classList.add( toRight ? 'lang-slide-out-right' : 'lang-slide-out-left' );

		setTimeout( () => {

			list.classList.remove( 'lang-slide-out-left', 'lang-slide-out-right' );
			state.lang = newLang;
			saveState();
			applyLang();
			renderTripSelector();
			renderAccoSelector();
			render();
			list.classList.add( toRight ? 'lang-slide-in-left' : 'lang-slide-in-right' );

			list.addEventListener( 'animationend', () => {
				list.classList.remove( 'lang-slide-in-left', 'lang-slide-in-right' );
			}, { once: true });

		}, 180 );

	});

	// Reset checks only
	document.getElementById( 'resetBtn' ).addEventListener( 'click', () => {

		const t = I18N[state.lang];
		if ( ! confirm( t.confirmReset ) ) return;

		state.checked = {};
		state.categories.forEach( c => state.expanded[c.id] = true );
		saveState();
		render();

	});

	// Full reset including custom items
	document.getElementById( 'resetAllBtn' ).addEventListener( 'click', () => {

		const t = I18N[state.lang];
		if ( ! confirm( t.confirmResetAll ) ) return;

		state.categories = JSON.parse( JSON.stringify( DEFAULT_CATEGORIES ) );
		state.checked = {};
		state.categories.forEach( c => state.expanded[c.id] = true );
		saveState();
		render();

	});

	// Init
	loadState();
	applyLang();
	renderTripSelector();
	renderAccoSelector();
	render();

</script>

</body>
</html>
